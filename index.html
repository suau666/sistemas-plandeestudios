<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a0f; --surface:#13131f; --border:#1e1e30;
  --pending-bg:#111120; --pending-border:#252540; --pending-text:#3a3a58;
  --regular-bg:#1a1500; --regular-border:#e6b800; --regular-text:#e6b800;
  --approved-bg:#001a0a; --approved-border:#2ecc71; --approved-text:#2ecc71;
  --available-bg:#15151f; --available-border:#d0d0e8; --available-text:#d0d0e8;
  --accent:#ff6b35; --text-main:#c0c0d0; --text-sub:#3a3a5a;
  --stat-label-color:#3a3a5a; --header-color:#fff;
}
body.theme-white {
  --bg:#f0f0f0; --surface:#fff; --border:#d5d5e0;
  --pending-bg:#e8e8f0; --pending-border:#b0b0c8; --pending-text:#8888a8;
  --regular-bg:#fffbe6; --regular-border:#c8a000; --regular-text:#996600;
  --approved-bg:#e6f9ee; --approved-border:#22a55a; --approved-text:#1a7a44;
  --available-bg:#f8f8ff; --available-border:#555580; --available-text:#333360;
  --accent:#e85520; --text-main:#222230; --text-sub:#8888a0;
  --stat-label-color:#9090a8; --header-color:#111120;
}
body.theme-aqua {
  --bg:#e8f7f5; --surface:#fff; --border:#b8ddd9;
  --pending-bg:#dff0ee; --pending-border:#9fcbc7; --pending-text:#6aaba6;
  --regular-bg:#fffbe6; --regular-border:#c8a000; --regular-text:#8a6d00;
  --approved-bg:#e0f5e9; --approved-border:#1fa055; --approved-text:#186640;
  --available-bg:#f0fffe; --available-border:#2a9090; --available-text:#1a6060;
  --accent:#0d7a72; --text-main:#1a3a38; --text-sub:#6a9a96;
  --stat-label-color:#6a9a96; --header-color:#0d3a36;
}
body.theme-cream {
  --bg:#f5f0e8; --surface:#faf7f0; --border:#ddd5c0;
  --pending-bg:#ede8de; --pending-border:#bdb098; --pending-text:#9a8e78;
  --regular-bg:#fff8e0; --regular-border:#c08000; --regular-text:#7a5200;
  --approved-bg:#e6f2e8; --approved-border:#2a9050; --approved-text:#1a6035;
  --available-bg:#f8f4ec; --available-border:#5a5040; --available-text:#3a3028;
  --accent:#c05020; --text-main:#3a3028; --text-sub:#9a8e78;
  --stat-label-color:#9a8e78; --header-color:#2a2018;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text-main); font-family:'Syne',sans-serif; min-height:100vh; transition:background .3s,color .3s; }

.theme-switcher { position:fixed; top:12px; right:16px; display:flex; align-items:center; gap:6px; z-index:100; }
.theme-swatch { width:22px; height:22px; border-radius:6px; cursor:pointer; border:2px solid transparent; transition:transform .15s,border-color .15s; flex-shrink:0; }
.theme-swatch:hover { transform:scale(1.15); }
.theme-swatch.active { border-color:var(--accent) !important; }
.swatch-dark  { background:#0a0a0f; border-color:#444; }
.swatch-white { background:#f0f0f0; border-color:#ccc; }
.swatch-aqua  { background:#7ecece; border-color:#5aafaf; }
.swatch-cream { background:#f5e6cc; border-color:#c8b090; }

.container { position:relative; z-index:1; max-width:1600px; margin:0 auto; padding:40px 30px; }

header { text-align:center; margin-bottom:32px; }
header h1 { font-weight:800; font-size:2.8rem; letter-spacing:-1px; color:var(--header-color); text-transform:uppercase; transition:color .3s; }
header h1 span { color:var(--accent); }
header p { font-family:'Space Mono',monospace; font-size:.7rem; letter-spacing:3px; color:var(--text-sub); margin-top:6px; text-transform:uppercase; transition:color .3s; }

/* STATS */
.stats { display:flex; justify-content:center; margin-bottom:32px; background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; width:fit-content; margin-left:auto; margin-right:auto; transition:background .3s,border-color .3s; }
.stat { padding:14px 26px; text-align:center; border-right:1px solid var(--border); transition:border-color .3s; }
.stat:last-child { border-right:none; }
.stat-number { font-family:'Syne',sans-serif; font-weight:800; font-size:1.7rem; line-height:1; }
.stat-label { font-family:'Space Mono',monospace; font-size:.52rem; letter-spacing:2px; text-transform:uppercase; color:var(--stat-label-color); margin-top:4px; transition:color .3s; }
.s-approved .stat-number { color:var(--approved-border); }
.s-regular  .stat-number { color:var(--regular-border); }
.s-available .stat-number { color:var(--available-border); }
.s-pending  .stat-number { color:var(--pending-text); }
.s-pct      .stat-number { color:var(--accent); }
.s-total    .stat-number { color:var(--header-color); }

/* LEGEND */
.legend { display:flex; justify-content:center; gap:24px; margin-bottom:36px; }
.legend-item { display:flex; align-items:center; gap:8px; font-family:'Space Mono',monospace; font-size:.6rem; letter-spacing:1px; color:var(--text-sub); text-transform:uppercase; transition:color .3s; }
.legend-dot { width:12px; height:12px; border-radius:3px; border:2px solid; transition:all .3s; }
.legend-dot.pending   { background:var(--pending-bg);  border-color:var(--pending-border); }
.legend-dot.available { background:var(--available-bg);border-color:var(--available-border); }
.legend-dot.regular   { background:var(--regular-bg);  border-color:var(--regular-border); }
.legend-dot.approved  { background:var(--approved-bg); border-color:var(--approved-border); }

/* SUBJECT CARD */
.subject {
  background:var(--pending-bg); border:1.5px solid var(--pending-border);
  border-radius:10px; padding:10px 12px 16px 12px;
  cursor:default; transition:all .18s ease;
  position:relative; user-select:none;
  display:flex; flex-direction:column; gap:4px;
  overflow:visible; min-height:56px; box-sizing:border-box;
  width:100%;
}
.subject.clickable { cursor:pointer; }
.subject.clickable:hover { transform:translateY(-2px); filter:brightness(1.12); }
.subject.available { background:var(--available-bg); border-color:var(--available-border); }
.subject.available .subject-name { color:var(--available-text); }
.subject.regular   { background:var(--regular-bg);   border-color:var(--regular-border);   box-shadow:0 0 12px rgba(230,184,0,.12); }
.subject.regular   .subject-name { color:var(--regular-text); }
.subject.approved  { background:var(--approved-bg);  border-color:var(--approved-border);  box-shadow:0 0 12px rgba(46,204,113,.12); }
.subject.approved  .subject-name { color:var(--approved-text); }

.subject-code { font-family:'Space Mono',monospace; font-size:.56rem; font-weight:700; color:var(--pending-border); line-height:1; pointer-events:none; transition:color .18s; flex-shrink:0; }
.subject.available .subject-code { color:var(--available-border); opacity:.6; }
.subject.regular   .subject-code { color:var(--regular-border);   opacity:.75; }
.subject.approved  .subject-code { color:var(--approved-border);  opacity:.75; }

.subject-name { font-size:.75rem; font-weight:600; color:var(--pending-text); line-height:1.5; transition:color .18s; display:block; padding-right:14px; padding-bottom:6px; overflow:visible; }
.status-pip { position:absolute; top:8px; right:8px; width:6px; height:6px; border-radius:50%; transition:background .18s; }
.subject.available .status-pip { background:var(--available-border); opacity:.5; }
.subject.regular   .status-pip { background:var(--regular-border); }
.subject.approved  .status-pip { background:var(--approved-border); }

.opt-name-input { background:transparent; border:none; outline:none; font-family:'Syne',sans-serif; font-size:.75rem; font-weight:600; color:var(--pending-text); width:100%; cursor:text; padding:0; line-height:1.28; transition:color .18s; padding-right:14px; }
.subject.available .opt-name-input { color:var(--available-text); }
.subject.regular   .opt-name-input { color:var(--regular-text); }
.subject.approved  .opt-name-input { color:var(--approved-text); }
.opt-name-input::placeholder { opacity:.35; font-style:italic; }
.opt-name-input:focus { border-bottom:1px dashed var(--accent); }

/* ── MAIN FLOW GRID ──────────────────────────────────────────────────────────
   Layout exacto de la imagen, girado 90°:
   La imagen original fluye izquierda→derecha en 6 "columnas" (niveles).
   Girado, esos niveles pasan a ser FILAS (top→bottom).
   Las "filas" originales de la imagen pasan a ser COLUMNAS del grid.

   Imagen original (de izq a der):
     Col A (CBC):       AM1, Economía, Der.Inf.I(*), Álgebra, HESG, Adm.Gral, Soc.Org — pero Der.Inf.I no es CBC
     Col B (2º tramo):  Estadística I, —, Sist.Admin.(274), —, HESA, Teoría Contable, Microeconomía I
     Col C (Prof.1):    —, —, ITIC, —, —, Gest.Costos(464?→247→464), Macroeconomía
     ...

   Releyendo la imagen con cuidado:
   - Fila 1 de imagen: AM1 → Estadística I → (nada más en esa fila)
                        Cálculo Financiero (276) → Adm.Financiera (279)
   - Fila 2: Economía (sin flecha a derecha en img)
   - Fila 3: Der.Inf.I (1603) → Sist.Admin (274) → ITIC (1275) → {Ing.SW, Der.Inf.I, Tec.Comp.SO}
              luego: Ing.SW → Metod.SI (658) → Gest.Rec.Inf (1799)
                     Der.Inf.I → Der.Inf.II (1604)
                     Tec.Comp.SO → Tec.Com (655) → Redes (740) → Act.Prof(1660)
                     Lógica (661) → {TLA(1652), Sist.Datos(663)}
                     TLA → Constr.Ap(1654) → Act.Prof(1660)
                     Sist.Datos → Seg.Inf(662) → Gest.Rec.Inf(1799)

   Reinterpretando la imagen (columnas = niveles izq→der):
   Nivel 1 (CBC): AM1, Economía, Álgebra, HESG, Adm.Gral, Soc.Org  [+ Der.Inf.I aparece acá como "prereq de 2º tramo" — pero en realidad 1603 prereq es 1275]
   Nivel 2 (2º tramo + algunos del prof sin prereq propio):
     Estadística I (248), HESA (249), Sist.Admin (274), Teoría Contable (247), Microeconomía I (250), Cálculo Financiero (276)
   Nivel 3: ITIC (1275), Lógica (661), Gest.Costos (464 req 247), Macroeco (278), Adm.Financiera (279 req 276)
   Nivel 4: Ing.SW (1601), Der.Inf.I (1603), Tec.Comp (1653), TLA (1652), Sist.Datos (663)
   Nivel 5: Metod.SI (658), Der.Inf.II (1604), Tec.Com (655), Constr.Ap (1654), Seg.Inf (662)
   Nivel 6: Redes (740), Act.Prof (1660), Gest.Rec.Inf (1799)

   Girando 90° → estos NIVELES son FILAS.
   Las posiciones horizontales en cada nivel → columnas.
   Usaré un grid de 8 columnas x 6 filas (rows tienen gap vertical).
   Cada fila = banda horizontal con label a la izquierda.
*/

/* Wrapper general del plan */
.plan-wrapper {
  border:1px solid var(--border); border-radius:14px;
  background:var(--surface); overflow:visible;
  transition:background .3s, border-color .3s;
}
.plan-header {
  padding:14px 20px; border-bottom:1px solid var(--border);
  font-family:'Space Mono',monospace; font-size:.58rem; letter-spacing:3px;
  text-transform:uppercase; color:var(--accent);
  transition:color .3s, border-color .3s;
}

/* El cuerpo del plan: SVG de flechas + grid de cards */
.plan-body {
  position:relative; padding:24px 20px 24px 20px;
}
#arrows-svg {
  position:absolute; top:0; left:0; width:100%; height:100%;
  pointer-events:none; z-index:0; overflow:visible;
}

/*
  Grid de 8 columnas.
  Cada card ocupa exactamente 1 celda (col, row).
  gap: 60px vertical (espacio para flechas), 10px horizontal.
*/
.plan-grid {
  position:relative; z-index:1;
  display:grid;
  grid-template-columns:repeat(8,1fr);
  grid-auto-rows:auto;
  gap:60px 10px;
}

/* Banda label a la izquierda — usamos pseudoelement en el wrapper para cada fila?
   Más sencillo: poner un div "label" en col 0 de cada fila visual.
   No: usaré elementos <div class="row-label"> posicionados en el grid.
   Les asigno col:1 y la fila correspondiente. Los cards van del col 2 en adelante.
   Pero eso complica el SVG.
   
   Decisión final: sin labels de fila, todo es un grid puro.
   Agregaré etiquetas flotantes a la izquierda usando position:absolute.
*/

/* Optativas */
.optativas-float { margin-top:16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.optativas-float-label { font-family:'Space Mono',monospace; font-size:.52rem; letter-spacing:2px; text-transform:uppercase; color:var(--text-sub); white-space:nowrap; transition:color .3s; }
#optativas-row { display:flex; gap:10px; flex-wrap:wrap; }
#optativas-row .subject { width:200px; flex-shrink:0; }

/* LOADING */
@keyframes ldot { 0%,80%,100%{transform:scale(0.6);opacity:.4} 40%{transform:scale(1);opacity:1} }
.loader-dot { width:10px; height:10px; border-radius:50%; background:var(--accent); animation:ldot 1.2s infinite ease-in-out both; }

/* SAVE */
.save-indicator { position:fixed; bottom:20px; right:24px; z-index:200; padding:8px 16px; border-radius:10px; font-family:'Space Mono',monospace; font-size:.6rem; letter-spacing:1px; text-transform:uppercase; pointer-events:none; transition:opacity .4s; }
.save-indicator.saved  { background:var(--approved-bg); border:1px solid var(--approved-border); color:var(--approved-text); }
.save-indicator.error  { background:var(--regular-bg);  border:1px solid var(--regular-border);  color:var(--regular-text); }

/* TOOLTIP */
.tooltip { position:fixed; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 14px; font-family:'Space Mono',monospace; font-size:.6rem; color:var(--text-main); pointer-events:none; opacity:0; transition:opacity .12s; z-index:9999; max-width:260px; line-height:1.8; }
.tooltip.visible { opacity:1; }

html, body { min-width:1300px; overflow-x:auto; }
</style>
</head>
<body>

<div id="loading-screen" style="position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:background .3s;">
  <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:2rem;letter-spacing:-1px;color:var(--header-color);text-transform:uppercase;">Sistemas <span style="color:var(--accent)">·</span> Plan de Estudios</div>
  <div style="display:flex;gap:6px;align-items:center;">
    <div class="loader-dot" style="animation-delay:0s"></div>
    <div class="loader-dot" style="animation-delay:.15s"></div>
    <div class="loader-dot" style="animation-delay:.3s"></div>
  </div>
  <div style="font-family:'Space Mono',monospace;font-size:.6rem;letter-spacing:3px;color:var(--text-sub);text-transform:uppercase;">Cargando tu progreso...</div>
</div>

<div id="save-indicator" class="save-indicator" style="opacity:0"></div>

<div class="theme-switcher">
  <div class="theme-swatch swatch-dark active"  title="Oscuro"     onclick="setTheme('dark',this)"></div>
  <div class="theme-swatch swatch-white"         title="Blanco"     onclick="setTheme('white',this)"></div>
  <div class="theme-swatch swatch-cream"         title="Cremita"    onclick="setTheme('cream',this)"></div>
  <div class="theme-swatch swatch-aqua"          title="Verde agua" onclick="setTheme('aqua',this)"></div>
</div>

<div id="app" style="display:none"><div class="container">
  <header>
    <h1>Sistemas <span>·</span> Plan de Estudios</h1>
    <p>Correlatividades · FCE · UBA</p>
  </header>

  <div class="stats" id="stats"></div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot pending"></div> Pendiente</div>
    <div class="legend-item"><div class="legend-dot available"></div> Puedo cursar</div>
    <div class="legend-item"><div class="legend-dot regular"></div> Regular</div>
    <div class="legend-item"><div class="legend-dot approved"></div> Aprobada</div>
  </div>

  <div class="plan-wrapper">
    <div class="plan-header">Licenciatura en Sistemas de Información de las Organizaciones · FCE UBA</div>
    <div class="plan-body">
      <svg id="arrows-svg"></svg>
      <div class="plan-grid" id="plan-grid"></div>
    </div>
  </div>

  <div class="optativas-float">
    <span class="optativas-float-label">Optativas</span>
    <div id="optativas-row"></div>
  </div>
</div></div>

<div class="tooltip" id="tooltip"></div>

<script>
// ── LOCAL STORAGE ─────────────────────────────────────────────────────────────
const STORAGE_KEY = 'sistemas_progress';
let saveTimer = null;
let currentTheme = 'dark';

function showSaved() {
  const el = document.getElementById('save-indicator');
  el.textContent = '✓ Guardado';
  el.className = 'save-indicator saved';
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 1800);
}
function showError() {
  const el = document.getElementById('save-indicator');
  el.textContent = '✗ Error al guardar';
  el.className = 'save-indicator error';
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 3000);
}
function saveProgress() {
  const statesPayload = {};
  for (const id in states) statesPayload[id] = states[id];
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      states: statesPayload,
      opt_names: { opt1: subjects.opt1.name, opt2: subjects.opt2.name },
      theme: currentTheme
    }));
    showSaved();
  } catch(e) { showError(); }
}
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(saveProgress, 800); }
function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const row = JSON.parse(raw);
    if (row.states) for (const id in row.states) { if (states[id] !== undefined) states[id] = row.states[id]; }
    if (row.opt_names) { if (row.opt_names.opt1 !== undefined) subjects.opt1.name = row.opt_names.opt1; if (row.opt_names.opt2 !== undefined) subjects.opt2.name = row.opt_names.opt2; }
    if (row.theme) { currentTheme = row.theme; applyTheme(row.theme); }
  } catch(e) {}
}
function applyTheme(name) {
  document.body.className = name === 'dark' ? '' : 'theme-' + name;
  document.querySelectorAll('.theme-swatch').forEach(s => s.classList.remove('active'));
  const el = document.querySelector('.swatch-' + name);
  if (el) el.classList.add('active');
  requestAnimationFrame(drawArrows);
}
function setTheme(name) { currentTheme = name; applyTheme(name); scheduleSave(); }

// ── DATA ──────────────────────────────────────────────────────────────────────
//
// Grid de 8 columnas x 6 filas (row 1..6, col 1..8)
// Correspondencia con la imagen girada 90° (niveles izq→der se convierten en filas top→bottom):
//
//  FILA 1 (CBC):
//    col1=241(AM1), col2=242(Eco), col3=245(Álg), col4=246(HESG), col5=252(AdmGral), col6=254(SocOrg)
//
//  FILA 2 (Segundo Tramo — prereq: CBC aprobado):
//    col1=248(Estad.I), col2=249(HESA), col3=250(Micro.I), col4=274(Sist.Adm.), col5=247(T.Contable), col6=276(Calc.Fin.)
//    [Macroeco 278 y Adm.Fin 279 también prereq CBC, van acá]
//    col7=278(Macroeco), col8=279(AdmFin — pero 279 prereq 276, no CBC → va en fila 3)
//
//  FILA 3 (prereq = alguna del 2º tramo):
//    col1=1275(ITIC — prereq: CBC), col2=661(Lógica — prereq: CBC)
//    col3=464(GestCostos — prereq: 247), col4=279(AdmFin — prereq: 276)
//    [278 Macroeco es solo prereq CBC, va en fila 2]
//
//  FILA 4 (prereq = alguna de fila 3):
//    col1=1653(TecComp — prereq: 1275), col2=1652(TLA — prereq: 661)
//    col3=1601(IngSW — prereq: 1275), col4=1603(DerInfI — prereq: 1275)
//    col5=663(SistDatos — prereq: 661)
//
//  FILA 5 (prereq = alguna de fila 4):
//    col1=655(TecCom — prereq: 1653), col2=1654(ConstrAp — prereq: 1652)
//    col3=658(MetodSI — prereq: 1601), col4=1604(DerInfII — prereq: 1603)
//    col5=662(SegInf — prereq: 663)
//
//  FILA 6 (prereq = alguna de fila 5):
//    col1=740(Redes — prereq: 655), col2=1660(ActProf — prereq: 740,1654)
//    col3=1799(GestRec — prereq: 658,662)
//
// Noto que 1660 prereq es 740 Y 1654 → en la imagen salen de fila diferente.
// Los pongo a todos en fila 6 y dibujo las flechas correspondientes.
//
// AJUSTE: en la imagen la secuencia es:
//   AM1 → Estadística I  (flechas verticales dentro de misma columna)
//   Cálculo Financiero → Adm.Financiera
//   Lógica → TLA → ConstrAp → ActProf
//   Lógica → SistDatos → SegInf → GestRec
//   ITIC → IngSW → MetodSI → GestRec
//   ITIC → DerInfI → DerInfII
//   ITIC → TecComp → TecCom → Redes → ActProf
//   247(TContable) → 464(GCostos) [en la imagen aparecen como Adm.Gral → TContable → GCostos]
//
// Corrección: en la imagen Adm.Gral → Teoría Contable → Gestión de Costos
// Eso sugiere que TContable prereq es Adm.Gral (no el CBC).
// Pero el plan oficial dice prereq = Ciclo General Aprobado para todo el 2º tramo.
// Seguimos el plan oficial.

const subjects = {
  // FILA 1 — CBC (sin prereqs)

// arrowDefs — solo materias del ciclo profesional (tramo 3)
const arrowDefs = [
  // Segundo Tramo → Ciclo Prof. nivel 1
  [247, 464],
  [276, 279],
  // 661 → nivel 2
  [661, 1652],
  [661, 663],
  // 1275 → nivel 2
  [1275, 1601],
  [1275, 1603],
  [1275, 1653],
  // nivel 2 → nivel 3
  [1652, 1654],
  [663,  662],
  [1601, 658],
  [1603, 1604],
  [1653, 655],
  // nivel 3 → nivel 4
  [655,  740],
  [1654, 1660],
  [740,  1660],
  [658,  1799],
  [662,  1799],
];

const states = {};

function initStates() {
  for (const id in subjects) states[id] = 'pending';
  states['opt1'] = 'available';
  states['opt2'] = 'available';
  recalc();
}

function cbcCompleto() {
  return [241,242,245,246,252,254].every(id => states[id] === 'approved');
}

function allApproved(ids) { return ids.every(id => states[id] === 'approved'); }

function prereqsMet(id) {
  const s = subjects[id];
  if (s.optional) return true;
  if (s.tramo === 1) return true;
  // Tramo 2: requiere CBC completo
  if (s.tramo === 2) return cbcCompleto();
  // Tramo 3: prereqs específicos; ITIC, 661, 278 requieren CBC
  if (s.tramo === 3) {
    if (!s.prereqsApproved.length) return cbcCompleto(); // ITIC, 661, 278 sin prereq específico
    return allApproved(s.prereqsApproved);
  }
  return true;
}

function recalc() {
  for (const id in subjects) {
    if (states[id] === 'approved' || states[id] === 'regular') continue;
    states[id] = prereqsMet(id) ? 'available' : 'pending';
  }
}

function cycle(id) {
  const s = states[id];
  if (s === 'pending') return;
  states[id] = s === 'available' ? 'regular' : s === 'regular' ? 'approved' : 'available';
  recalc();
  renderAll();
  scheduleSave();
}

// ── CARD ─────────────────────────────────────────────────────────────────────
function makeCard(id) {
  const subj = subjects[id];
  const state = states[id];
  const isOpt = subj.editable;

  const div = document.createElement('div');
  div.className = `subject ${state}${state !== 'pending' ? ' clickable' : ''}`;
  div.id = `card-${id}`;

  let nameEl;
  if (isOpt) {
    nameEl = document.createElement('input');
    nameEl.type = 'text';
    nameEl.className = 'opt-name-input';
    nameEl.placeholder = 'Escribí la materia...';
    nameEl.value = subj.name || '';
    nameEl.addEventListener('input', e => { subj.name = e.target.value; scheduleSave(); });
    nameEl.addEventListener('click', e => e.stopPropagation());
  } else {
    nameEl = document.createElement('span');
    nameEl.className = 'subject-name';
    nameEl.textContent = subj.name;
  }

  const codeEl = document.createElement('span');
  codeEl.className = 'subject-code';
  codeEl.textContent = isOpt ? (subj.label || id) : (isNaN(id) ? '—' : id);

  const pip = document.createElement('div');
  pip.className = 'status-pip';

  div.appendChild(codeEl);
  div.appendChild(nameEl);
  div.appendChild(pip);

  if (state !== 'pending') div.addEventListener('click', () => cycle(id));

  if (!isOpt) {
    div.addEventListener('mouseenter', e => {
      if (state === 'pending') {
        // Armar texto de prereqs faltantes
        let missing = [];
        if (subj.tramo === 2) {
          missing = [241,242,245,246,252,254].filter(p => states[p] !== 'approved').map(p => `${p} – ${subjects[p]?.name || p}`);
        } else if (subj.tramo === 3 && !subj.prereqsApproved.length) {
          missing = [241,242,245,246,252,254].filter(p => states[p] !== 'approved').map(p => `${p} – ${subjects[p]?.name || p}`);
        } else if (subj.prereqsApproved?.length) {
          missing = subj.prereqsApproved.filter(p => states[p] !== 'approved').map(p => `${p} – ${subjects[p]?.name || p}`);
        }
        if (missing.length) showTip(e, `Falta aprobar:\n${missing.join('\n')}`);
      } else if (state === 'available') {
        showTip(e, 'Click → Regular · Click 2× → Aprobada');
      }
    });
    div.addEventListener('mousemove', moveTip);
    div.addEventListener('mouseleave', hideTip);
  }

  return div;
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('plan-grid');
  grid.innerHTML = '';

  // Renderizar todas las materias con col/row
  for (const id in subjects) {
    const s = subjects[id];
    if (s.optional || s.col === undefined) continue;
    const card = makeCard(id);
    card.style.gridColumn = s.col;
    card.style.gridRow    = s.row;
    grid.appendChild(card);
  }

  // Optativas
  const optRow = document.getElementById('optativas-row');
  optRow.innerHTML = '';
  ['opt1','opt2'].forEach(id => optRow.appendChild(makeCard(id)));

  requestAnimationFrame(() => requestAnimationFrame(drawArrows));
}

function renderAll() { renderStats(); renderGrid(); }

// ── ARROWS ───────────────────────────────────────────────────────────────────
function drawArrows() {
  const svg = document.getElementById('arrows-svg');
  svg.innerHTML = '';
  const parent = svg.parentElement;
  const pRect = parent.getBoundingClientRect();
  const ns = 'http://www.w3.org/2000/svg';

  const isLight = ['theme-white','theme-aqua','theme-cream'].some(cl => document.body.classList.contains(cl));
  const cPend = isLight ? 'rgba(100,105,140,.65)' : 'rgba(130,130,185,.85)';
  const cAppr = isLight ? 'rgba(18,135,65,.70)'   : 'rgba(46,204,113,.75)';

  const defs = document.createElementNS(ns,'defs');
  const mkM = (id, col) => {
    const m = document.createElementNS(ns,'marker');
    m.setAttribute('id', id); m.setAttribute('markerWidth','10'); m.setAttribute('markerHeight','8');
    m.setAttribute('refX','9'); m.setAttribute('refY','4'); m.setAttribute('orient','auto');
    m.setAttribute('markerUnits','userSpaceOnUse');
    const pg = document.createElementNS(ns,'polygon');
    pg.setAttribute('points','0,0.5 9,4 0,7.5 2,4'); pg.setAttribute('fill', col);
    m.appendChild(pg); return m;
  };
  defs.appendChild(mkM('ad', cPend));
  defs.appendChild(mkM('ao', cAppr));
  svg.appendChild(defs);

  function R(el) {
    const r = el.getBoundingClientRect(), ox=pRect.left, oy=pRect.top;
    return { l:r.left-ox, r:r.right-ox, t:r.top-oy, b:r.bottom-oy,
             cx:r.left-ox+r.width/2, cy:r.top-oy+r.height/2, w:r.width, h:r.height };
  }

  // Calcular secuencias de salida/entrada para spreading
  const exitSeq={}, entSeq={};
  arrowDefs.forEach(([f,t]) => {
    exitSeq[f] = exitSeq[f]||[]; exitSeq[f].push(t);
    entSeq[t]  = entSeq[t] ||[]; entSeq[t].push(f);
  });

  function exitX(f, t, i, n) {
    const ideal = Math.max(f.l + 6, Math.min(f.r - 6, t.cx));
    if (n === 1) return ideal;
    const range = f.w * 0.52;
    const base = f.cx + (i/(n-1) - 0.5) * range;
    return base * 0.4 + ideal * 0.6;
  }
  function entryX(f, t, i, n) {
    const ideal = Math.max(t.l + 6, Math.min(t.r - 6, f.cx));
    if (n === 1) return ideal;
    const range = t.w * 0.52;
    const base = t.cx + (i/(n-1) - 0.5) * range;
    return base * 0.4 + ideal * 0.6;
  }

  arrowDefs.forEach(([fId, tId]) => {
    const fEl = document.getElementById('card-'+fId);
    const tEl = document.getElementById('card-'+tId);
    if (!fEl || !tEl) return;

    const f = R(fEl), t = R(tEl);
    const approved = states[fId]==='approved';
    const stroke = approved ? cAppr : cPend;
    const MLEN = 9;

    const eArr = exitSeq[fId]||[], aArr = entSeq[tId]||[];
    const ei = eArr.indexOf(tId), ai = aArr.indexOf(fId);

    const x1 = exitX(f, t, ei, eArr.length);
    const y1 = f.b;
    const x2 = entryX(f, t, ai, aArr.length);
    const y2 = t.t + MLEN;

    const dy = y2 - y1, dx = x2 - x1;
    const tension = Math.max(dy * 0.15, 12);
    const c1x = x1 + dx*0.1, c1y = y1 + tension;
    const c2x = x2 - dx*0.1, c2y = y2 - tension;

    const path = document.createElementNS(ns,'path');
    path.setAttribute('d', `M${x1.toFixed(1)},${y1.toFixed(1)} C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`);
    path.setAttribute('stroke', stroke);
    path.setAttribute('stroke-width','1.5');
    path.setAttribute('fill','none');
    path.setAttribute('stroke-linecap','round');
    path.setAttribute('marker-end', approved ? 'url(#ao)' : 'url(#ad)');
    svg.appendChild(path);
  });
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function renderStats() {
  const div = document.getElementById('stats');
  const allIds = Object.keys(subjects);
  const total = allIds.length;
  const c = {approved:0,regular:0,available:0,pending:0};
  allIds.forEach(id => {
    const st = states[id];
    if      (st==='approved')  c.approved++;
    else if (st==='regular')   c.regular++;
    else if (st==='available') c.available++;
    else                       c.pending++;
  });
  const pct = total > 0 ? Math.round(c.approved / total * 100) : 0;
  div.innerHTML = `
    <div class="stat s-approved"><div class="stat-number">${c.approved}</div><div class="stat-label">Aprobadas</div></div>
    <div class="stat s-regular"><div class="stat-number">${c.regular}</div><div class="stat-label">Regulares</div></div>
    <div class="stat s-available"><div class="stat-number">${c.available}</div><div class="stat-label">Puedo cursar</div></div>
    <div class="stat s-pending"><div class="stat-number">${c.pending}</div><div class="stat-label">Pendientes</div></div>
    <div class="stat s-pct"><div class="stat-number">${pct}%</div><div class="stat-label">Aprobado</div></div>
    <div class="stat s-total"><div class="stat-number">${total}</div><div class="stat-label">Total materias</div></div>`;
}

// ── TOOLTIP ───────────────────────────────────────────────────────────────────
const tip = document.getElementById('tooltip');
let tv = false;
function showTip(e,t){tip.innerHTML=t.replace(/\n/g,'<br>');tip.classList.add('visible');tv=true;moveTip(e);}
function moveTip(e){if(!tv)return;tip.style.left=(e.clientX+16)+'px';tip.style.top=(e.clientY-8)+'px';}
function hideTip(){tip.classList.remove('visible');tv=false;}

window.addEventListener('resize', () => requestAnimationFrame(drawArrows));

function boot() {
  initStates();
  loadProgress();
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  renderAll();
}
boot();
